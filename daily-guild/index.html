footer{color:var(--sub);font-size:.78rem;text-align:center;line-height:1.7;padding-bottom:12px}

</head>

    <p id="catHint" style="color:var(--sub);font-size:.88rem"></p>
    <div id="tutorial"></div>
    <div id="quests"></div>
  </section>

  </section>

  <section class="card">
    <h2>週替わりボス</h2>
    <div class="boss" id="bossBox"></div>
  </section>

  <section class="card">

function weekKeyOf(d){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var shift=(x.getDay()+6)%7; x.setDate(x.getDate()-shift);
  return dateKey(x);
}
function bossFor(weekKey){ return BOSSES[seedFrom(weekKey)%BOSSES.length]; }
function bossChance(top3,distinct){ return Math.max(5,Math.min(95, 40+Math.floor((top3-120)/2)+(distinct?10:0))); }
function topPowerSum(invs,k){ var ps=invs.map(function(v){return v.power;}).sort(function(a,b){return b-a;}); var s=0; for(var i=0;i<Math.min(k,ps.length);i++) s+=ps[i]; return s; }

 "{inv}を持って「{q}」へ。しかし一歩届かず。悔しさは明日の糧になる。",
 "「{q}」攻略は失敗。だが{inv}の新しい弱点が分かったのは収穫だった。",
 "「{q}」の前に敗退。しかし誰も怪我はなく、ギルドは無事を祝った。",
 "{inv}は頑張った。「{q}」には届かなかったが、その姿は皆の記憶に残った。"];
function logText(ok,key,slot,qName,invName){
  var arr=ok?LOG_OK:LOG_NG;
  var t=arr[seedFrom(key+":log:"+slot)%arr.length];
  return t.replace("{q}",qName).replace("{inv}",invName);
}
function streakFrom(keys,todayKey){
  var set={}; keys.forEach(function(k){ set[k]=1; });
  function prev(k){ var p=k.split("-").map(Number); var d=new Date(p[0],p[1]-1,p[2]); d.setDate(d.getDate()-1); return dateKey(d); }
  var n=0, grace=false, cur=todayKey;
  if(!set[cur]) cur=prev(cur);
  while(true){
    if(set[cur]){ n++; cur=prev(cur); }
    else if(!grace){ grace=true; cur=prev(cur); }
    else break;
  }
  return n;
}
function lendText(inv){
  return "【今日の迷発明を貸します】"+inv.name+"（パワー"+inv.power+"／"+inv.rarity+"）\n"+ITEMS[inv.i].n+"が"+FUNCS[inv.f].v+"。"+BUTS[inv.b]+"。\n今日だけ貸すから、クエストやボス戦に使ってみて 👉 発明コード "+inv.code+"\n#まいにち冒険ギルド";
}
function verdictFor(ok,chance,roll){
  if(ok){
    if(chance<=40) return "奇跡の大逆転！";
    if(roll<=5) return "圧勝。文句なし";
    if(chance>=85) return "順当勝ち";
    return "見事な攻略";
  }
  if(chance>=85) return "まさかの大ポカ…";
  if(chance<=30) return "挑戦は立派だった";
  if(roll-chance<=5) return "あと一歩の惜敗";
  return "力及ばず";
}
function buildShare(key,day,exp,level,streak){
  var lines=day.quests.map(function(qi,k){
    var r=day.results[k];
    return (r?(r.success?"✅":"❌"):"⬜")+" "+MISSIONS[qi].t+(r?("（"+r.invName+"）評語："+(r.verdict||"")):"");
  });
  var grid=day.quests.map(function(qi,k){ var r=day.results[k]; return r?(r.success?"🟩":"🟥"):"⬜"; }).join("");
  return "まいにち冒険ギルド "+key+" Lv."+level+(streak&&streak>1?" 🔥"+streak+"日連続":"")+"\n"+grid+"\n"+lines.join("\n")+"\n累計 "+exp+" EXP #まいにち冒険ギルド";
}

function pageUrl(){ return location.origin+location.pathname; }

function shareSmart(text,canvas){

  else { doText(); }
}
